name: Windows release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: windows-release-${{ github.ref }}

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      RELEASE_ASSET: wiki-windows-x64.zip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test Wiki
        run: cargo test --locked --release --target x86_64-pc-windows-msvc

      - name: Build Wiki
        run: .\build-wiki.ps1

      - name: Package Windows ZIP
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          Compress-Archive -LiteralPath .\target\wiki-app -DestinationPath $archive

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          $response = gh release view $tag --json assets,isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $archive --verify-tag --generate-notes
            exit $LASTEXITCODE
          }

          $release = $response | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -EQ $env:RELEASE_ASSET
          if (-not $asset -or $asset.state -eq 'starter') {
            $uploadArgs = @('release', 'upload', $tag, $archive)
            # GitHub may leave an empty starter asset after a failed upload.
            if ($asset.state -eq 'starter') { $uploadArgs += '--clobber' }
            gh @uploadArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          if ($release.isDraft) {
            gh release edit $tag --draft=false
            exit $LASTEXITCODE
          }
